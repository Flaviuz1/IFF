name: Build IFF

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        run: g++ *.cpp -o iff

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: g++ (Get-ChildItem -Filter *.cpp | Select-Object -ExpandProperty Name) -o iff.exe
        shell: pwsh
        
      - name: Upload binary (Linux/Mac)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iff-${{ matrix.os }}
          path: iff

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iff-windows
          path: iff.exe